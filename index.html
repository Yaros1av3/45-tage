<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mein 45-Tage-Weg</title>
  <meta name="description" content="Dein persönlicher Übungsplan – abhaken, Timer, Fortschritt.">
  <meta name="theme-color" content="#fff6f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1418" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="45 Tage">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff7a9c"/>
        <stop offset="1" stop-color="#ffa58f"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app">
    <header class="top">
      <div class="top-text">
        <p id="hello" class="hello"></p>
        <h1 id="title">Dein 45-Tage-Weg</h1>
      </div>
      <div id="streak" class="streak" title="Serie in Tagen">🔥 0</div>
    </header>

    <main>
      <section id="view-today" class="view"></section>
      <section id="view-plan" class="view" hidden></section>
      <section id="view-progress" class="view" hidden></section>
      <section id="view-more" class="view" hidden></section>
    </main>
  </div>

  <nav class="tabs" aria-label="Hauptmenü">
    <button data-act="tab" data-tab="today" aria-label="Heute">
      <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.6A5.4 5.4 0 0 1 12 6.3a5.4 5.4 0 0 1 9.6 4.6c-2.1 5-9.6 9.6-9.6 9.6z"/></svg>
      <span>Heute</span>
    </button>
    <button data-act="tab" data-tab="plan" aria-label="Plan">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Plan</span>
    </button>
    <button data-act="tab" data-tab="progress" aria-label="Fortschritt">
      <svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V5M19 20v-10"/></svg>
      <span>Fortschritt</span>
    </button>
    <button data-act="tab" data-tab="more" aria-label="Mehr">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      <span>Mehr</span>
    </button>
  </nav>

  <!-- Übung bearbeiten (Bottom Sheet) -->
  <div id="sheet" class="overlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="Tag bearbeiten">
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- Bestätigungsdialog -->
  <div id="dialog" class="overlay center" aria-hidden="true">
    <div class="panel modal" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
      <h3 id="dlgTitle"></h3>
      <p id="dlgText" class="muted"></p>
      <div class="modal-actions">
        <button id="dlgCancel" class="btn ghost"></button>
        <button id="dlgOk" class="btn primary"></button>
      </div>
    </div>
  </div>

  <!-- Feier-Fenster -->
  <div id="celebrate" class="overlay center" aria-hidden="true">
    <div class="panel modal celebrate" role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <div class="cel-glow"></div>
      <div id="celEmoji" class="cel-emoji">🎉</div>
      <h2 id="celTitle"></h2>
      <p id="celText" class="muted"></p>
      <p id="celStreak" class="cel-streak"></p>
      <button id="celBtn" class="btn primary wide">Weiter 💗</button>
    </div>
  </div>

  <!-- Timer -->
  <div id="timer" class="overlay timer" aria-hidden="true">
    <div class="timer-wrap" role="dialog" aria-modal="true" aria-label="Timer">
      <div class="timer-top">
        <button class="icon-btn" data-act="timer-close" aria-label="Timer schließen">✕</button>
      </div>
      <div class="timer-body">
        <p id="timerPhase" class="timer-phase">Mach dich bereit …</p>
        <h2 id="timerName">Plank</h2>
        <div class="timer-ring">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="ring-bg" cx="100" cy="100" r="88"/>
            <circle id="timerRing" class="ring-fg" cx="100" cy="100" r="88" transform="rotate(-90 100 100)"/>
          </svg>
          <div id="timerTime" class="timer-time" aria-live="off">0:15</div>
        </div>
        <div class="timer-actions">
          <button id="timerReset" class="btn ghost" data-act="timer-reset">Neustart</button>
          <button id="timerPrimary" class="btn primary" data-act="timer-primary">Pause</button>
        </div>
      </div>
    </div>
  </div>

  <input id="file" type="file" accept="application/json,.json" hidden>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
